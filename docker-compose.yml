services:
  ssh-battos:
    build: .
    image: ssh-battos
    container_name: ssh-battos
    restart: unless-stopped
    ports:
      # host:container — host port 22, app listens on 23234 in the container
      - "22:23234"
    environment:
      # optional: raises the GitHub API limit from 60 to 5,000 requests/hour
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_USER: ${GITHUB_USER:-batt0s}
    volumes:
      # persist the generated ed25519 host key across recreated containers
      - ssh-battos-keys:/app/.ssh

volumes:
  ssh-battos-keys:
